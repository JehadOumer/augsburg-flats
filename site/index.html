<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#ffffff" />
  <title>Augsburg Flats</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="sticky-shell">
    <section class="controls notranslate" id="controlsBar">
      <div class="controls-main" id="controlsMain">
        <div class="top-compact">
          <div class="top-line brand-line">
            <div class="brand-inline">
              <h1>Augsburg Flats</h1>
              <span class="subtitle">University area · own place · €600–700 · max €900</span>
            </div>
            <div class="top-actions">
              <button type="button" class="btn ghost sm" id="btnMap" aria-pressed="true" title="Show or hide map">Map</button>
              <button type="button" class="btn ghost sm" id="btnSettings" title="Sync settings">Sync</button>
            </div>
          </div>
          <div class="top-line tools-line">
            <label class="dist-filter">
              <span class="dist-label-text">Max metro</span>
              <div class="dist-slider">
                <input type="range" id="fDistMax" min="10" max="90" step="5" value="90" />
                <span id="fDistMaxLabel">Any</span>
              </div>
            </label>
            <p class="sync-status" id="syncStatus"></p>
          </div>
        </div>

        <div class="controls-body" id="controlsBody">
          <div class="filters filters-row">
            <label class="field-grow">Search
              <input type="search" id="fQ" placeholder="balcony, Göggingen…" />
            </label>
            <label class="field-narrow">Max €
              <input type="number" id="fPriceMax" value="900" min="0" step="50" />
            </label>
            <label class="field-narrow">Min €
              <input type="number" id="fPriceMin" value="" min="0" step="50" placeholder="—" />
            </label>
            <label>Photos
              <select id="fPhotos" class="filter-select">
                <option value="0" selected>Any</option>
                <option value="2">2+</option>
                <option value="3">3+</option>
                <option value="5">5+</option>
              </select>
            </label>
            <label>Shortlist
              <select id="fShortlist" class="filter-select">
                <option value="all" selected>All</option>
                <option value="only">Only</option>
                <option value="hide">Hide</option>
              </select>
            </label>
            <label>Term
              <select id="fTerm" class="filter-select">
                <option value="" selected>Any</option>
                <option value="short">Short</option>
                <option value="long">Long</option>
              </select>
            </label>
            <label>Tenancy
              <select id="fTenancy" class="filter-select">
                <option value="" selected>Any</option>
                <option value="owner">Direct</option>
                <option value="sublet">Sublet</option>
              </select>
            </label>
            <div class="filter-dd" id="sourceDropdown">
              <span class="filter-dd-label">Sources</span>
              <button type="button" class="filter-dd-btn" id="sourceDdBtn" aria-haspopup="listbox" aria-expanded="false">
                <span id="sourceDdSummary">All</span>
                <svg class="filter-dd-caret" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
                  <path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </button>
              <div class="filter-dd-panel" id="sourceDdPanel" hidden role="listbox" aria-multiselectable="true">
                <label class="filter-dd-option">
                  <input type="checkbox" id="sourceAll" checked />
                  <span>All sources</span>
                </label>
                <div class="filter-dd-divider"></div>
                <div id="sourceDdOptions"></div>
              </div>
            </div>
            <label>Sort
              <select id="fSort" class="filter-select">
                <option value="score">Best match</option>
                <option value="price_asc">Price ↑</option>
                <option value="price_desc">Price ↓</option>
                <option value="transit">Fastest by metro</option>
                <option value="distance">Closest</option>
                <option value="newest">Newest</option>
                <option value="size">Largest</option>
              </select>
            </label>
          </div>
          <div class="filters filters-row filters-row-actions">
            <label class="checkbox"><input type="checkbox" id="fSept" /> Free by Sept 1</label>
            <label class="checkbox"><input type="checkbox" id="fGone" /> Show rented/gone</label>
            <label class="checkbox"><input type="checkbox" id="fShowHidden" /> Hidden only</label>
          </div>
        </div>
      </div>
      <button type="button" class="controls-toggle" id="btnFoldControls" title="Hide filters" aria-expanded="true" aria-controls="controlsMain">
        <svg class="fold-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </section>

    <div class="layout" id="layout">
      <aside class="map-panel" id="mapPanel">
        <div id="map"></div>
        <div class="map-legend">
          <span><i class="dot score-high"></i> ≥70</span>
          <span><i class="dot score-mid"></i> 40–69</span>
          <span><i class="dot score-low"></i> &lt;40</span>
          <span><i class="dot cat-shortlist"></i> Shortlist</span>
        </div>
      </aside>

      <main class="gallery-panel">
        <div class="gallery-toolbar">
          <div class="gallery-meta" id="galleryMeta">Loading…</div>
          <div class="grid-toggle" role="group" aria-label="Listings per row">
            <button type="button" class="grid-btn active" id="gridCols2" data-cols="2" title="2 per row">2</button>
            <button type="button" class="grid-btn" id="gridCols3" data-cols="3" title="3 per row">3</button>
          </div>
        </div>
        <div class="gallery cols-2" id="gallery"></div>
      </main>
    </div>
  </div>

  <div class="drawer-backdrop" id="drawerBackdrop" hidden></div>
  <aside class="drawer" id="drawer" hidden>
    <button type="button" class="drawer-close" id="drawerClose" aria-label="Close">×</button>
    <div id="drawerContent"></div>
  </aside>

  <dialog class="settings-dialog" id="settingsDialog">
    <form method="dialog" id="settingsForm">
      <h2>Sync shortlist &amp; hide</h2>
      <p class="hint">Private GitHub Gist keeps iPhone and iPad in sync. Token stays in this browser only.</p>
      <label>GitHub token (gist scope)
        <input type="password" id="gistToken" autocomplete="off" placeholder="ghp_…" />
      </label>
      <label>Gist ID <span class="muted">(blank to create)</span>
        <input type="text" id="gistId" placeholder="optional" />
      </label>
      <p class="settings-msg" id="settingsMsg" hidden></p>
      <div class="dialog-actions">
        <button type="submit" class="btn primary" value="save">Save &amp; sync</button>
        <button type="button" class="btn ghost" id="btnClearPrefs">Clear token</button>
        <button type="submit" class="btn ghost" value="cancel">Close</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" hidden></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/prefs.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
